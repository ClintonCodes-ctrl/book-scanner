<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book box scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --paper:#F1F3F6;--card:#fff;--ink:#0F1B2D;--mute:#5B6778;--line:#DDE2EA;
  --pri:#0F1B2D;--prik:#fff;--amber:#FFB81C;--ok:#12805C;--warn:#B35A0A;--bad:#B3261E;
  --label:#0F1B2D;--labelink:#fff;--r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0A1019;--card:#131D2B;--ink:#EAF0F8;--mute:#93A1B5;--line:#25344A;
  --pri:#FFB81C;--prik:#0A1019;--ok:#3CC79A;--warn:#F0A25A;--bad:#F2837C;
  --label:#1B2A40;--labelink:#fff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0 auto;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(104px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;margin:6px 2px 12px}
h3{margin:0 0 12px;font-size:1.15rem}
p{margin:0 0 10px}

/* mode switch */
.seg{display:flex;gap:2px;background:var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);border-radius:11px;min-height:42px;font-weight:700}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}

/* controls */
input,button{font:inherit;min-height:50px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input{width:100%}
input::placeholder{color:var(--mute);opacity:.8}
button{cursor:pointer;font-weight:700;transition:transform .08s ease}
button:active{transform:scale(.97)}
button.p{background:var(--pri);color:var(--prik);border-color:var(--pri)}
button.on{background:var(--pri);color:var(--prik);border-color:var(--pri)}
.seg button.on{background:var(--card);color:var(--ink);border:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.big{width:100%;font-size:1.05rem;min-height:56px}
.link{width:100%;border:0;background:none;color:var(--mute);text-decoration:underline;text-underline-offset:3px;min-height:44px;font-weight:600}
.hide{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.lab{display:block;font-size:.8rem;font-weight:600;margin:0 0 4px;color:var(--mute)}

/* the carton label: destination + box number */
.label{position:relative;background:var(--label);color:var(--labelink);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:14px;
  display:grid;grid-template-columns:1fr 92px;gap:6px 12px;align-items:end;overflow:hidden}
.label::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:repeating-linear-gradient(135deg,var(--amber) 0 10px,var(--label) 10px 20px)} /* carton tape */
.label .lab{color:#fffb;padding-left:6px}
.label input{background:transparent;border:0;border-bottom:2px solid #fff4;border-radius:0;color:#fff;min-height:48px;padding:6px 6px}
.label input::placeholder{color:#fff7}
.label input:focus{outline:none;border-bottom-color:var(--amber)}
#station{font-size:1rem;font-weight:800;text-overflow:ellipsis}
#box{font-size:3rem;font-weight:900;line-height:1;text-align:right;color:var(--amber);font-variant-numeric:tabular-nums;min-height:56px;padding-right:2px}
.label .bx .lab{text-align:right}

/* scanner */
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
#reader{width:100%;margin-top:12px;border-radius:14px;overflow:hidden;background:#000}
#reader:empty{margin:0;height:0;border-radius:0}
#torch{margin-top:10px}
.isbnrow{display:flex;gap:8px;margin-top:12px}
.isbnrow input{flex:1;min-width:0;font-size:1.1rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.isbnrow button{min-width:92px}
#msg{margin:12px 0 0;padding:12px 14px;border-radius:14px;font-weight:600;background:var(--paper);color:var(--mute);border-left:6px solid var(--line)}
#msg.ok{border-left-color:var(--ok);color:var(--ink)}
#msg.wait{border-left-color:var(--amber);color:var(--ink)}
#msg.bad{border-left-color:var(--bad);color:var(--ink)}

/* the books: one ruled sheet */
#list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.item{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px 13px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.item.pending::before{background:var(--amber)}
.item.missing::before{background:var(--bad)}
.item.new{animation:fl 1.4s ease-out}
@keyframes fl{from{background:color-mix(in srgb,var(--amber) 35%,var(--card))}to{background:var(--card)}}
.info{padding-right:26px;min-width:0}
.ti{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.au{color:var(--mute);font-size:.92rem;margin-top:1px}
.is{color:var(--mute);font-size:.78rem;font-variant-numeric:tabular-nums;margin-top:2px}
.pend{color:var(--warn);font-weight:600}
.item.missing .pend{color:var(--bad)}
.step{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:14px;padding:2px}
.step button{min-width:42px;min-height:42px;padding:0;font-size:1.3rem;border:0;background:transparent}
.step input{width:44px;min-height:42px;padding:0;text-align:center;border:0;background:transparent;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.step input[type=number],#mc{-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.x{position:absolute;top:0;right:2px;width:34px;min-height:34px!important;padding:0!important;border:0!important;background:none!important;color:var(--mute);font-size:.9rem}
.empty{text-align:center;color:var(--mute);padding:28px 18px;margin:0}

/* bottom dock */
.bar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px #0001}
#tot{flex:1;line-height:1.15;color:var(--mute);font-size:.85rem}
#tot b{display:block;color:var(--ink);font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums}
.bar button{min-width:0;padding:10px 14px}

/* merge */
input[type=file]{padding:8px;min-height:0;font-size:.95rem}
input[type=file]::file-selector-button{font:inherit;font-weight:700;margin-right:12px;padding:10px 14px;border-radius:12px;border:0;background:var(--pri);color:var(--prik)}
#mmsg{font-weight:600;color:var(--mute)}

dialog{border:0;border-radius:var(--r);background:var(--card);color:var(--ink);width:min(92vw,420px);padding:18px;box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
dialog input{margin-bottom:10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.label{grid-template-columns:1fr 80px}#box{font-size:2.4rem}}
</style>
</head>
<body>
<h1>Book box scanner</h1>
<div class="seg"><button id="tScan" class="on">Enter a box</button><button id="tMerge">Merge boxes</button></div>

<section id="scan">
  <div class="label">
    <div><label class="lab" for="station">Destination</label><input id="station" list="dests" placeholder="e.g. SHANZU PROBATION" autocomplete="off" autocapitalize="characters"><datalist id="dests"></datalist></div>
    <div class="bx"><label class="lab" for="box">Box</label><input id="box" inputmode="numeric" placeholder="14" autocomplete="off"></div>
  </div>
  <div class="card">
    <button id="cam" class="big p">Start camera</button>
    <div id="reader"></div>
    <button id="torch" class="big hide" aria-pressed="false">Flashlight off</button>
    <div class="isbnrow"><input id="isbn" inputmode="numeric" enterkeyhint="go" placeholder="Type or scan ISBN" autocomplete="off"><button id="add" class="p">Add</button></div>
    <p id="msg" role="status">Ready. Scan the first book.</p>
    <button id="manual" class="link">No ISBN? Add a book manually</button>
  </div>
  <div id="list"></div>
  <button id="clr" class="link">Finish this box and start the next</button>
  <div class="bar"><span id="tot"></span><button id="exp">Excel</button><button id="expw" class="p">Word list</button></div>
</section>

<section id="merge" class="hide">
  <div class="card">
    <p>Choose the Excel files (from "Excel (for merging)") for boxes going to the same destination. Copies for the same ISBN are added together and S/NO is renumbered.</p>
    <input type="file" id="files" accept=".xlsx,.xls" multiple>
    <div class="row" style="margin-top:10px"><input id="mstation" placeholder="Destination, e.g. MWINGI (WAITA) PRISON"><input id="mname" placeholder="File name (e.g. Mwingi_All)"><button id="mgow" class="p">Merge to Word</button><button id="mgo">Merge to Excel</button></div>
    <p id="mmsg" role="status"></p>
  </div>
</section>

<dialog id="dlg">
  <form method="dialog" id="mf">
    <h3>Add book without ISBN</h3>
    <input id="mt" placeholder="Title" required>
    <input id="ma" placeholder="Author">
    <input id="mc" type="number" min="1" value="1" aria-label="Copies">
    <div class="row"><button value="x" formnovalidate>Cancel</button><button class="p" value="ok">Add</button></div>
  </form>
</dialog>

<script>
const $=id=>document.getElementById(id);
const KEY='bookbox.v1';
let S={station:'',box:'',items:[]},flash=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const say=(t,k)=>{const m=$('msg');m.textContent=t;m.className=k||''};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ISBN helpers: everything is stored as ISBN-13 */
function toIsbn13(raw){
  const s=String(raw).toUpperCase().replace(/[^0-9X]/g,'');
  if(s.length===13&&/^\d+$/.test(s))return s;
  if(s.length===10&&/^\d{9}[\dX]$/.test(s)){
    const b='978'+s.slice(0,9);
    let sum=0;for(let i=0;i<12;i++)sum+=+b[i]*(i%2?3:1);
    return b+((10-sum%10)%10);
  }
  return null;
}

/* Title lookup: several sources asked at once, best-ranked hit wins.
   Local cache (incl. titles typed by hand) is checked first. */
const CKEY='bookbox.cache.v1';
let CACHE={};try{CACHE=JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){}
const remember=(isbn,title,author)=>{if(!isbn||!title)return;CACHE[isbn]={title,author:author||''};try{localStorage.setItem(CKEY,JSON.stringify(CACHE))}catch(e){}};
const toIsbn10=i=>{ // only 978-prefixed ISBN-13s have a 10-digit twin
  if(!/^978\d{10}$/.test(i))return null;
  const b=i.slice(3,12);let s=0;for(let k=0;k<9;k++)s+=+b[k]*(10-k);
  const c=(11-s%11)%11;return b+(c===10?'X':c);
};
async function getJson(url){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),9000);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  finally{clearTimeout(t)}
}
const fmt=(t,sub,au)=>t?{title:t+(sub?': '+sub:''),author:Array.isArray(au)?au.filter(Boolean).join(', '):(au||'')}:null;
const SOURCES=[
  async(i,j)=>{ // Open Library, ISBN-13 and ISBN-10 keys
    const keys=[i,j].filter(Boolean).map(k=>'ISBN:'+k);
    const d=await getJson(`https://openlibrary.org/api/books?bibkeys=${keys.join(',')}&format=json&jscmd=data`);
    for(const k of keys){const b=d[k];if(b&&b.title)return fmt(b.title,b.subtitle,(b.authors||[]).map(a=>a.name))}
    return null;
  },
  async(i)=>{ // Open Library search index (finds editions the data API misses)
    const d=await getJson(`https://openlibrary.org/search.json?q=isbn:${i}&fields=title,subtitle,author_name&limit=1`);
    const b=(d.docs||[])[0];return b?fmt(b.title,b.subtitle,b.author_name):null;
  },
  async(i,j)=>{ // Google Books, both ISBN forms
    for(const q of [i,j].filter(Boolean)){
      const d=await getJson(`https://www.googleapis.com/books/v1/volumes?q=isbn:${q}&maxResults=1`);
      const v=(d.items||[])[0]?.volumeInfo;if(v&&v.title)return fmt(v.title,v.subtitle,v.authors);
    }
    return null;
  },
  async(i)=>{ // Crossref: academic and publisher books worldwide
    const d=await getJson(`https://api.crossref.org/works?filter=isbn:${i}&rows=1&select=title,subtitle,author`);
    const b=(d.message?.items||[])[0];
    return b&&b.title?.[0]?fmt(b.title[0],b.subtitle?.[0],(b.author||[]).map(a=>[a.given,a.family].filter(Boolean).join(' '))):null;
  },
];
async function lookup(isbn){
  if(CACHE[isbn])return CACHE[isbn];
  const j=toIsbn10(isbn);
  const res=await Promise.allSettled(SOURCES.map(s=>s(isbn,j)));
  const hit=res.find(r=>r.status==='fulfilled'&&r.value);
  if(hit){remember(isbn,hit.value.title,hit.value.author);return hit.value}
  // every source failed to answer (offline/blocked): let the caller retry later
  if(res.every(r=>r.status==='rejected'))throw new Error('no source reachable');
  return null; // reached at least one service, book not found
}

/* Adding books */
async function addIsbn(raw){
  const isbn=toIsbn13(raw);
  if(!isbn){say('Not a valid ISBN: '+raw+'. Check the digits.','bad');return}
  flash=isbn;setTimeout(()=>{flash=null},1500);
  const ex=S.items.find(i=>i.isbn===isbn);
  if(ex){ex.copies++;save();render();say(`+1 copy: ${ex.title||isbn} (now ${ex.copies})`,'ok');beep('copy');return}
  const it={isbn,title:'',author:'',copies:1,state:'pending'};
  S.items.unshift(it);save();render();beep('new');say('Looking up '+isbn+'…','wait');
  await resolve(it);
}
async function resolve(it){
  try{
    const r=await lookup(it.isbn);
    if(r){it.title=r.title;it.author=r.author;it.state='ok';say('Added: '+r.title,'ok')}
    else{it.state='missing';beep('miss');say('Not found online: '+it.isbn+'. Tap the row to type the title.','bad')}
  }catch(e){it.state='pending';say('Lookup failed (offline or blocked). Book saved, will retry.','wait')}
  save();render();
}
function retryPending(){S.items.filter(i=>i.state==='pending'&&i.isbn).forEach(resolve)}
addEventListener('online',retryPending);

/* Distinct feedback so you can tell outcomes apart without looking:
   new = one high beep, copy = two quick mid beeps, miss = long low buzz */
/* Feedback. Sound is generated as small WAV files played through normal <audio>
   elements: these keep working when an iPhone is on silent and when the call
   comes from the camera callback, once unlocked by the first tap on the page.
   Vibration is long and hard (Android only; iPhone browsers do not support it). */
const TONES={
  new: {v:[180],         n:[[880,0,.14,.9]]},
  copy:{v:[120,70,120],  n:[[660,0,.09,.9],[660,.13,.09,.9]]},
  miss:{v:[500],         n:[[160,0,.5,.9]]}
};
function makeWav(notes,kind){
  const R=22050,len=Math.ceil(Math.max(...notes.map(x=>x[1]+x[2]))*R)+400,d=new Int16Array(len);
  notes.forEach(([f,st,du,vol])=>{
    for(let i=0;i<du*R;i++){
      const t=i/R,env=Math.min(1,i/200,(du*R-i)/400);
      const ph=2*Math.PI*f*t,w=kind==='miss'?(ph%(2*Math.PI))/Math.PI-1:Math.sign(Math.sin(ph))*.6+Math.sin(ph)*.4; // buzzy square-ish: loud on phone speakers
      d[Math.floor(st*R)+i]+=w*env*vol*30000;
    }
  });
  const b=new ArrayBuffer(44+len*2),v=new DataView(b),W=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  W(0,'RIFF');v.setUint32(4,36+len*2,true);W(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,R,true);v.setUint32(28,R*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,len*2,true);
  new Int16Array(b,44).set(d);
  let bin='';new Uint8Array(b).forEach(x=>bin+=String.fromCharCode(x));
  return 'data:audio/wav;base64,'+btoa(bin);
}
const SND={};
try{for(const k in TONES){const a=new Audio(makeWav(TONES[k].n,k));a.preload='auto';a.volume=1;SND[k]=a}}catch(e){}
let unlocked=false;
function unlock(){ // play each clip silently once inside a real tap so later plays are allowed
  if(unlocked)return;unlocked=true;
  for(const k in SND){const a=SND[k];a.muted=true;const p=a.play();
    const done=()=>{a.pause();a.currentTime=0;a.muted=false};
    p&&p.then?p.then(done).catch(()=>{a.muted=false;unlocked=false}):done()}
}
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function beep(kind='new'){
  const t=TONES[kind]||TONES.new;
  try{navigator.vibrate&&navigator.vibrate(t.v)}catch(e){}
  try{const a=SND[kind]||SND.new;a.currentTime=0;const p=a.play();p&&p.catch&&p.catch(()=>{})}catch(e){}
}

/* Rendering */
function render(){
  $('list').innerHTML=S.items.length?S.items.map((it,i)=>{
    const t=it.state==='pending'?'<span class="pend">title pending…</span>':
      it.state==='missing'?'<span class="pend">not found, tap to enter</span>':esc(it.title);
    return `<div class="item ${it.state||''}${it.isbn&&it.isbn===flash?' new':''}">
    <div class="info" data-edit="${i}"><div class="ti">${t}</div><div class="au">${esc(it.author)}</div><div class="is">${esc(it.isbn||'No ISBN')}</div></div>
    <div class="step"><button data-d="${i}" aria-label="Fewer">−</button>
    <input type="number" min="1" value="${it.copies}" data-c="${i}" aria-label="Copies">
    <button data-u="${i}" aria-label="More">+</button></div>
    <button class="x" data-x="${i}" aria-label="Delete book">✕</button></div>`}).join(''):'<p class="empty">This box is empty.<br>Start the camera or type an ISBN to add the first book.</p>';
  const n=S.items.reduce((a,i)=>a+i.copies,0);
  $('tot').innerHTML=`<b>${n} books</b>${S.items.length} titles`;
  $('station').value=S.station;$('box').value=S.box;
}
$('list').addEventListener('click',e=>{
  const t=e.target,g=k=>t.dataset[k];
  if(g('u')!==undefined)S.items[+g('u')].copies++;
  else if(g('d')!==undefined){const it=S.items[+g('d')];if(it.copies>1)it.copies--}
  else if(g('x')!==undefined){if(confirm('Delete this row?'))S.items.splice(+g('x'),1)}
  else if(t.closest('[data-edit]')&&t.tagName!=='INPUT'){
    const it=S.items[+t.closest('[data-edit]').dataset.edit];
    const v=prompt('Title',it.title);if(v===null)return;
    it.title=v;it.author=prompt('Author',it.author)??it.author;it.state='ok';
    remember(it.isbn,it.title,it.author); // same ISBN never needs typing again
  }else return;
  save();render();
});
$('list').addEventListener('change',e=>{
  if(e.target.dataset.c!==undefined){S.items[+e.target.dataset.c].copies=Math.max(1,parseInt(e.target.value)||1);save();render()}
});
/* Recent destinations (datalist) */
const DKEY='bookbox.dest.v1';
let DEST=[];try{DEST=JSON.parse(localStorage.getItem(DKEY)||'[]')}catch(e){}
function rememberDest(){
  const d=S.station.trim();if(!d)return;
  DEST=[d,...DEST.filter(x=>x.toUpperCase()!==d.toUpperCase())].slice(0,15);
  try{localStorage.setItem(DKEY,JSON.stringify(DEST))}catch(e){}drawDest();
}
function drawDest(){$('dests').innerHTML=DEST.map(d=>`<option value="${esc(d)}">`).join('')}
$('station').onchange=rememberDest;
$('station').oninput=e=>{S.station=e.target.value;save()};
$('box').oninput=e=>{S.box=e.target.value;save()};

/* Hardware scanner / typed input */
const submitIsbn=()=>{const v=$('isbn').value.trim();$('isbn').value='';if(v)addIsbn(v);$('isbn').focus()};
$('isbn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitIsbn()}});
$('isbn').addEventListener('input',e=>{if(e.target.value.replace(/[^0-9X]/gi,'').length===13)submitIsbn()});
$('add').onclick=submitIsbn;

/* Camera */
let cam=null,last='',lastT=0,torchOn=false;
const setTorchLabel=()=>{$('torch').textContent='Flashlight '+(torchOn?'on':'off');$('torch').setAttribute('aria-pressed',torchOn);$('torch').classList.toggle('on',torchOn)};
$('torch').onclick=async()=>{
  if(!cam)return;
  try{await cam.applyVideoConstraints({advanced:[{torch:!torchOn}]});torchOn=!torchOn;setTorchLabel()}
  catch(e){say('Flashlight not available on this camera.','bad')}
};
$('cam').onclick=async()=>{
  if(cam){await cam.stop().catch(()=>{});try{cam.clear()}catch(e){}cam=null;$('cam').textContent='Start camera';$('cam').classList.remove('on');torchOn=false;$('torch').classList.add('hide');return}
  if(!window.Html5Qrcode){say('Camera library did not load. Check your connection.');return}
  try{
    cam=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13],useBarCodeDetectorIfSupported:true});
    await cam.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:120}},txt=>{
      const now=Date.now();
      if(txt===last&&now-lastT<2500)return; // ignore same code held in view
      last=txt;lastT=now;addIsbn(txt);
    });
    $('cam').textContent='Stop camera';$('cam').classList.add('on');
    // show the flashlight button only if this phone's camera supports a torch
    try{if(cam.getRunningTrackCapabilities().torch){torchOn=false;setTorchLabel();$('torch').classList.remove('hide')}}catch(e){}
  }catch(e){cam=null;say('Camera unavailable. It needs HTTPS and camera permission.')}
};

/* Manual add */
$('manual').onclick=()=>{$('mt').value='';$('ma').value='';$('mc').value=1;$('dlg').showModal()};
$('dlg').addEventListener('close',()=>{
  if($('dlg').returnValue==='ok'&&$('mt').value.trim()){
    S.items.unshift({isbn:'',title:$('mt').value.trim(),author:$('ma').value.trim(),copies:Math.max(1,parseInt($('mc').value)||1),state:'ok'});
    save();render();
  }
});

/* Export */
const clean=s=>(s||'').trim().replace(/[^\w\-]+/g,'_')||'Unnamed';
function boxWorkbook(){
  const rows=S.items.slice().reverse().map(i=>({ISBN:i.isbn,Title:i.title,Author:i.author,Copies:i.copies}));
  const ws=XLSX.utils.json_to_sheet(rows,{header:['ISBN','Title','Author','Copies']});
  ws['!cols']=[{wch:16},{wch:48},{wch:30},{wch:8}];
  // keep ISBN as text so Excel does not mangle it
  rows.forEach((r,i)=>{const c=ws['A'+(i+2)];if(c&&r.ISBN){c.t='s';c.v=r.ISBN}});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Box');
  return wb;
}
const boxName=()=>`${clean(S.station)}_Box${clean(S.box)}`;
$('exp').onclick=()=>{
  if(!S.items.length){say('Nothing to export yet.');return}
  XLSX.writeFile(boxWorkbook(),boxName()+'.xlsx');
  say('Exported. Start a new box when you are done.');
};
$('clr').onclick=()=>{
  if(S.items.length&&!confirm('Clear this box and start a new one? Export first if you have not.'))return;
  rememberDest();
  const n=/^\d+$/.test(String(S.box).trim())?String(+S.box+1):''; // next box number
  S={station:S.station,box:n,items:[]};save();render();$('isbn').focus();
};

const up=t=>String(t||'').toUpperCase();
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function downloadWord(rows,station,fname,asBlob){
  const D=docx,F='Tahoma',C=D.AlignmentType.CENTER;
  const run=(t,b)=>new D.TextRun({text:t,bold:!!b,font:F,size:24});
  const P=(t,b,al)=>new D.Paragraph({alignment:al,children:[run(t,b)]});
  const W=[1000,3800,2300,2260];
  const cell=(t,i,b,al)=>new D.TableCell({width:{size:W[i],type:D.WidthType.DXA},children:[P(t,b,al)]});
  const head=new D.TableRow({tableHeader:true,children:['S/NO','TITLE','AUTHOR','NO. OF COPIES'].map((t,i)=>cell(t,i,true))});
  const body=rows.map((r,n)=>new D.TableRow({cantSplit:true,children:[cell(String(n+1),0),cell(up(r.Title),1),cell(up(r.Author),2),cell(String(r.Copies),3)]}));
  const total=rows.reduce((a,r)=>a+(+r.Copies||0),0);
  const totalRow=new D.TableRow({cantSplit:true,children:[cell('',0),cell('TOTAL',1,true),cell('',2),cell(String(total),3,true)]});
  const dots=n=>'.'.repeat(n);
  // dot leader runs from the label to the right margin, so every line ends at the same place
  const sign=(l)=>new D.Paragraph({spacing:{before:240},tabStops:[{type:D.TabStopType.RIGHT,position:9360,leader:D.LeaderType.DOT}],children:[run(l,true),new D.TextRun({children:[new D.Tab()],font:F,size:24})]});
  const logo=Uint8Array.from(atob(LOGO),c=>c.charCodeAt(0));
  const doc=new D.Document({sections:[{
    properties:{page:{size:{width:12240,height:15840},margin:{top:964,bottom:964,left:1440,right:1440}}},
    children:[
      new D.Paragraph({alignment:C,children:[new D.ImageRun({data:logo,type:'png',transformation:{width:82,height:61}})]}),
      P('MINISTRY OF INTERIOR AND NATIONAL ADMINISTRATION',true,C),
      P('STATE DEPARTMENT FOR CORRECTIONAL SERVICES',true,C),
      P('LIBRARY DEPARTMENT',true,C),
      new D.Paragraph({children:[]}),
      P('LIST OF BOOKS TO '+(up(station.trim())||'____________________'),true),
      new D.Paragraph({children:[]}),
      new D.Table({layout:D.TableLayoutType.FIXED,width:{size:9360,type:D.WidthType.DXA},columnWidths:W,rows:[head,...body,totalRow]}),
      new D.Paragraph({children:[]}),
      new D.Paragraph({keepNext:true,children:[run('RECEIVED BY',true)]}),
      sign('NAME:'),sign('SIGNATURE:'),sign('DATE:')
    ]}]});
  const blob=await D.Packer.toBlob(doc);
  if(asBlob)return blob;
  saveBlob(blob,fname+'.docx');
}
$('expw').onclick=async()=>{
  if(!S.items.length){say('Nothing to export yet.','bad');return}
  const rows=S.items.slice().reverse().map(i=>({Title:i.title||(i.isbn?'ISBN '+i.isbn:''),Author:i.author,Copies:i.copies}));
  const miss=S.items.filter(i=>i.state!=='ok').length;
  if(miss&&!confirm(miss+' book(s) still have no title. Download anyway?'))return;
  try{await downloadWord(rows,S.station,clean(S.station)+'_Box'+clean(S.box));say('Word list downloaded.','ok')}
  catch(e){say('Word export failed: '+e.message+'. Is the docx library loaded?','bad')}
};

/* Merge */
async function doMerge(kind){
  const fs=[...$('files').files];
  if(fs.length<2){$('mmsg').textContent='Choose at least two files.';return}
  const map=new Map();
  for(const f of fs){
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{raw:false});
    const box=f.name.replace(/\.xlsx?$/i,'');
    for(const r of rows){
      const isbn=String(r.ISBN??'').trim(),title=String(r.Title??'').trim(),author=String(r.Author??'').trim();
      const n=parseInt(r.Copies)||1;
      const k=isbn||('m:'+title.toLowerCase()+'|'+author.toLowerCase());
      const e=map.get(k)||{ISBN:isbn,Title:title,Author:author,Copies:0,Boxes:[]};
      if(!e.Title&&title)e.Title=title;if(!e.Author&&author)e.Author=author;
      e.Copies+=n;if(!e.Boxes.includes(box))e.Boxes.push(box);
      map.set(k,e);
    }
  }
  const out=[...map.values()].map(e=>({...e,Boxes:e.Boxes.join(', ')}));
  const ws=XLSX.utils.json_to_sheet(out,{header:['ISBN','Title','Author','Copies','Boxes']});
  ws['!cols']=[{wch:16},{wch:48},{wch:30},{wch:8},{wch:30}];
  out.forEach((r,i)=>{const c=ws['A'+(i+2)];if(c&&r.ISBN){c.t='s';c.v=r.ISBN}});
  const fn=clean($('mname').value||'Merged');
  if(kind==='word')await downloadWord(out,$('mstation').value,fn);
  else{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Merged');XLSX.writeFile(wb,fn+'.xlsx')}
  $('mmsg').textContent=`Merged ${fs.length} files into ${out.length} titles.`;
}
$('mgo').onclick=()=>doMerge('xlsx');$('mgow').onclick=()=>doMerge('word');

/* Tabs */
function tab(m){
  $('scan').classList.toggle('hide',m);$('merge').classList.toggle('hide',!m);
  $('tScan').classList.toggle('on',!m);$('tMerge').classList.toggle('on',m);
}
$('tScan').onclick=()=>tab(false);$('tMerge').onclick=()=>tab(true);

drawDest();render();retryPending();
</script>
